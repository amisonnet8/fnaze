<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="fnaze: file by file, what changed and why.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#161b22"/>
      <stop offset="1" stop-color="#2a1f3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .path { fill: #79c0ff; }
    .desc { fill: #c9d1d9; }
    .detail { fill: #8b949e; }
  </style>

  <rect width="1280" height="360" rx="16" fill="url(#bg)"/>

  <!-- A description file: the title, then one line per changed file -->
  <rect x="48" y="52" width="580" height="256" rx="10" fill="#0d1117" stroke="url(#accent)" stroke-width="2"/>
  <g class="mono">
    <text x="72" y="90" fill="#f0f6fc" font-weight="bold"># Extend the session lifetime on access</text>
    <text x="72" y="128" class="path">src/auth/</text>
    <text x="90" y="158" class="path">session.go</text>
    <text x="252" y="158" class="desc">Extend the lifetime on every access</text>
    <text x="90" y="188" class="path">*_test.go</text>
    <text x="252" y="188" class="desc">Add tests for the extension</text>
    <text x="72" y="218" class="path">config/auth.yaml</text>
    <text x="252" y="218" class="desc">Set the default session.ttl to 30m</text>
    <text x="252" y="244" class="detail">| Users reported sessions expiring</text>
    <text x="72" y="280" class="path">docs/old.md</text>
    <text x="252" y="280" class="desc">Removed; moved to docs/auth.md</text>
  </g>

  <!-- Name and catch copy -->
  <text x="688" y="176" class="sans" font-size="104" font-weight="700" fill="#f0f6fc">fnaze</text>
  <rect x="692" y="198" width="300" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="690" y="252" class="sans" font-size="30" fill="#e6edf3">File by file: what changed, and why.</text>
</svg>
