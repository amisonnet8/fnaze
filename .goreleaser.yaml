# The release archives of this project (.claude/rules/distribution.md). On a
# tag, .github/workflows/release.yml runs this, which attaches the archives to a
# draft Release, and then publishes the Release. Locally: qsoku snapshot.
#
# For the template: rename yourproject (project_name, the main package, the
# binary and the main package given to tools/licenses) once the project has its
# command in cmd/<name>/. Until then qsoku snapshot and a release fail, as there
# is nothing to build. goreleaser check needs a git repository with a remote.
version: 2

project_name: yourproject

before:
  hooks:
    # The license texts of what is built into the command, put into every
    # archive.
    - go run ./tools/licenses bin/licenses ./cmd/yourproject

builds:
  - main: ./cmd/yourproject
    binary: yourproject
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # The tag as it is (v0.1.0), the same as go install shows.
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      # The directory itself, not a glob: with a glob that matches one file
      # only (a project with no dependencies has just go/LICENSE), goreleaser
      # drops the parent directories and the archive gets licenses/LICENSE.
      - src: bin/licenses
        dst: licenses

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc

# A draft, which release.yml publishes once everything is attached. The draft
# left by a failed run is replaced by the next run for the tag.
release:
  draft: true
  replace_existing_draft: true
